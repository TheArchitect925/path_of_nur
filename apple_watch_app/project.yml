name: PathOfNurWatch
options:
  deploymentTarget:
    watchOS: "10.0"
targets:
  PathOfNurWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - PathOfNurWatch
    info:
      path: PathOfNurWatch/Info.plist
      properties:
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathofnur.watch
        PRODUCT_NAME: Path of Nur Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PathOfNurWatch/PathOfNurWatch.entitlements
        INFOPLIST_KEY_UNUserNotificationCenterDelegateClassName: $(PRODUCT_MODULE_NAME).WatchNotificationCoordinator
  PathOfNurWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - PathOfNurWatchComplications
      - PathOfNurWatch/Domain
      - PathOfNurWatch/Data
      - PathOfNurWatch/Shared
    info:
      path: PathOfNurWatchComplications/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathofnur.watch.complications
        PRODUCT_NAME: Path of Nur Watch Complications
        INFOPLIST_KEY_CFBundleDisplayName: Path of Nūr
        CODE_SIGN_ENTITLEMENTS: PathOfNurWatchComplications/PathOfNurWatchComplications.entitlements
    dependencies:
      - target: PathOfNurWatch
