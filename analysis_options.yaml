include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**

linter:
  # Keep the lint layer practical:
  # - rely on `flutter_lints` for the base set
  # - add only low-noise rules that improve production hygiene
  # - avoid style-only rules that would create broad churn without clear value
  rules:
    avoid_print: true
