<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; the web build is served
       from mcsnow.ca/pathofnur/ (see web_deploy/README.md). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A companion for worship and learning.">
  <meta name="theme-color" content="#E6C491">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Path of Nur">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Path of Nur</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #EFE7D8; }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #E4BE8A 0%, #EBD6B4 45%, #EFE7D8 100%);
      transition: opacity 400ms ease;
      z-index: 1;
    }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(120, 80, 30, 0.22);
      animation: breathe 2.4s ease-in-out infinite;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash img { animation: none; }
      #splash { transition: none; }
    }
    noscript p {
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #3B2F22;
      text-align: center;
      margin-top: 40vh;
    }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading Path of Nur">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <noscript><p>Turn on JavaScript to open Path of Nur.</p></noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('gone');
      setTimeout(function () { splash.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
