name: Update goldens

# The golden baselines in test/goldens/ are pixel comparisons, so they only
# match the renderer that produced them. Regenerating them on a developer's Mac
# makes CI fail; regenerating them here makes CI the single source of truth.
#
# Run this from the Actions tab against the branch whose baselines need
# refreshing, then review the commit it pushes before merging.

on:
  workflow_dispatch:

jobs:
  update-goldens:
    # Must match the runner that verifies them in ci.yml, or this just moves
    # the mismatch around.
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate goldens
        run: flutter test test/release_readiness_golden_test.dart --update-goldens

      - name: Verify the regenerated baselines pass
        run: flutter test test/release_readiness_golden_test.dart

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- test/goldens; then
            echo "Baselines already match this runner; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- test/goldens
          git commit -m "test(goldens): regenerate baselines on the CI runner

          Golden files are pixel comparisons, so a baseline rendered on a
          developer machine fails on macos-latest. Regenerated by the
          update-goldens workflow so the runner that checks them is the runner
          that made them."
          git push origin HEAD:${{ github.ref_name }}
