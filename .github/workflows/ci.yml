name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Runtime PNG asset policy
        run: bash tooling/scripts/check_runtime_png_policy.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Localization gate
        run: python3 tools/localization_gate.py --release-from-source

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Debug APK build
        run: flutter build apk --debug

  ios-watchos-preflight:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: brew install ripgrep

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Golden tests (macOS-rendered baselines)
        run: flutter test test/release_readiness_golden_test.dart

      - name: iOS + watchOS preflight
        run: bash scripts/ci_ios_watchos_preflight.sh

      - name: Apple bundle consistency
        run: bash scripts/ci_apple_bundle_consistency.sh

      - name: Apple signing doctor
        run: bash scripts/apple_signing_doctor.sh

      - name: Apple archive packaging validation
        run: bash scripts/validate_apple_archive.sh
