name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Runtime PNG asset policy
        run: bash tooling/scripts/check_runtime_png_policy.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  ios-watchos-preflight:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS + watchOS preflight
        run: bash scripts/ci_ios_watchos_preflight.sh

      - name: Apple bundle consistency
        run: bash scripts/ci_apple_bundle_consistency.sh

      - name: Apple signing doctor
        run: bash scripts/apple_signing_doctor.sh

      - name: Apple archive packaging validation
        run: bash scripts/validate_apple_archive.sh
